services:
  api-gateway:
    build:
      context: ./services/api_gateway
    container_name: api-gateway
    environment:
      SERVICE_NAME: api-gateway
      LOG_LEVEL: INFO
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      AGENT_REGISTRY_URL: http://agent-registry:8003
      PROVIDER_REGISTRY_URL: http://provider-registry:8002
      ROUTER_URL: http://router-service:8001
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: 8000
      PLATFORM_API_TOKEN: agenthub-client-token
      ADMIN_API_TOKEN: agenthub-admin-token
      ALLOWED_API_KEYS: >
        [
          {"token": "agenthub-client-token", "key_id": "default-client", "name": "Default Client"},
          {"token": "agenthub-k6-token", "key_id": "k6-load-test", "name": "k6 Load Test"}
        ]
      MLFLOW_ENABLED: "true"
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: agenthub-gateway-requests
    ports:
      - "8000:8000"
    depends_on:
      agent-registry:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      mock-agent-summarizer:
        condition: service_healthy
      mock-agent-classifier:
        condition: service_healthy
      router-service:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  router-service:
    build:
      context: ./services/router_service
    container_name: router-service
    environment:
      SERVICE_NAME: router-service
      LOG_LEVEL: INFO
      AGENT_REGISTRY_URL: http://agent-registry:8003
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      PROVIDER_REGISTRY_URL: http://provider-registry:8002
      ROUTER_HOST: 0.0.0.0
      ROUTER_PORT: 8001
      ADMIN_API_TOKEN: agenthub-admin-token
      PROVIDER_CONFIG: >
        [
          {
            "provider_id": "mock-openai",
            "provider_name": "mock-openai",
            "base_url": "http://mock-provider-openai:8101",
            "supported_models": ["gpt-4o-mini", "shared-demo-model"],
            "weight": 1
          },
          {
            "provider_id": "mock-anthropic",
            "provider_name": "mock-anthropic",
            "base_url": "http://mock-provider-anthropic:8102",
            "supported_models": ["claude-3-haiku", "shared-demo-model"],
            "weight": 1
          }
        ]
    ports:
      - "8005:8001"
    depends_on:
      agent-registry:
        condition: service_healthy
      provider-registry:
        condition: service_healthy
      mock-provider-openai:
        condition: service_healthy
      mock-provider-anthropic:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  mock-provider-openai:
    build:
      context: ./services/mock_provider_openai
    container_name: mock-provider-openai
    environment:
      SERVICE_NAME: mock-provider-openai
      PROVIDER_ID: mock-openai
      PROVIDER_NAME: mock-openai
      PROVIDER_PORT: 8101
      DEFAULT_MODEL: gpt-4o-mini
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      ADMIN_API_TOKEN: agenthub-admin-token
      STREAM_DELAY_SECONDS: 0.15
      BASE_LATENCY_MS: 250
    ports:
      - "8101:8101"
    depends_on:
      otel-collector:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8101/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  mock-provider-anthropic:
    build:
      context: ./services/mock_provider_anthropic
    container_name: mock-provider-anthropic
    environment:
      SERVICE_NAME: mock-provider-anthropic
      PROVIDER_ID: mock-anthropic
      PROVIDER_NAME: mock-anthropic
      PROVIDER_PORT: 8102
      DEFAULT_MODEL: claude-3-haiku
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      ADMIN_API_TOKEN: agenthub-admin-token
      STREAM_DELAY_SECONDS: 0.25
      BASE_LATENCY_MS: 400
    ports:
      - "8102:8102"
    depends_on:
      otel-collector:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8102/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  provider-registry:
    build:
      context: ./services/provider_registry
    container_name: provider-registry
    environment:
      SERVICE_NAME: provider-registry
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      ADMIN_API_TOKEN: agenthub-admin-token
      PROVIDER_COOLDOWN_SECONDS: 30
      DATA_DIR: /data
      INITIAL_PROVIDERS: >
        [
          {
            "provider_id": "mock-openai",
            "provider_name": "mock-openai",
            "base_url": "http://mock-provider-openai:8101",
            "supported_models": ["gpt-4o-mini", "shared-demo-model"],
            "weight": 1,
            "price_input_per_1k": 0.15,
            "price_output_per_1k": 0.60,
            "priority": 100,
            "enabled": true,
            "health_status": "healthy"
          },
          {
            "provider_id": "mock-anthropic",
            "provider_name": "mock-anthropic",
            "base_url": "http://mock-provider-anthropic:8102",
            "supported_models": ["claude-3-haiku", "shared-demo-model"],
            "weight": 1,
            "price_input_per_1k": 0.12,
            "price_output_per_1k": 0.48,
            "priority": 100,
            "enabled": true,
            "health_status": "healthy"
          }
        ]
    ports:
      - "8006:8002"
    volumes:
      - provider-registry-data:/data
    depends_on:
      otel-collector:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  agent-registry:
    build:
      context: ./services/agent_registry
    container_name: agent-registry
    environment:
      SERVICE_NAME: agent-registry
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      ADMIN_API_TOKEN: agenthub-admin-token
      DATA_DIR: /data
      INITIAL_AGENTS: >
        [
          {
            "agent_id": "summarizer-agent",
            "name": "Summarizer Agent",
            "description": "Summarizes text and incident context.",
            "supported_methods": ["summarize_text", "summarize_incident"],
            "endpoint_url": "http://mock-agent-summarizer:8201",
            "status": "active",
            "auth_required": false
          },
          {
            "agent_id": "classifier-agent",
            "name": "Classifier Agent",
            "description": "Classifies text topics and priorities.",
            "supported_methods": ["classify_topic", "classify_priority"],
            "endpoint_url": "http://mock-agent-classifier:8202",
            "status": "active",
            "auth_required": false
          }
        ]
    ports:
      - "8007:8003"
    volumes:
      - agent-registry-data:/data
    depends_on:
      otel-collector:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  mock-agent-summarizer:
    build:
      context: ./services/mock_agent_summarizer
    container_name: mock-agent-summarizer
    environment:
      SERVICE_NAME: mock-agent-summarizer
      AGENT_ID: summarizer-agent
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "8201:8201"
    depends_on:
      otel-collector:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8201/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  mock-agent-classifier:
    build:
      context: ./services/mock_agent_classifier
    container_name: mock-agent-classifier
    environment:
      SERVICE_NAME: mock-agent-classifier
      AGENT_ID: classifier-agent
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "8202:8202"
    depends_on:
      otel-collector:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8202/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  k6:
    image: grafana/k6:latest
    profiles:
      - loadtest
    working_dir: /scripts
    environment:
      BASE_URL: http://api-gateway:8000
      MOCK_OPENAI_ADMIN_URL: http://mock-provider-openai:8101
      MOCK_ANTHROPIC_ADMIN_URL: http://mock-provider-anthropic:8102
      PROVIDER_REGISTRY_URL: http://provider-registry:8002
      PLATFORM_API_TOKEN: agenthub-client-token
      ADMIN_API_TOKEN: agenthub-admin-token
    volumes:
      - ./tests/load:/scripts:ro
    depends_on:
      api-gateway:
        condition: service_healthy
      mock-provider-openai:
        condition: service_healthy
      provider-registry:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      agent-registry:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
      provider-registry:
        condition: service_healthy
      router-service:
        condition: service_healthy
      mock-agent-summarizer:
        condition: service_healthy
      mock-agent-classifier:
        condition: service_healthy
      mock-provider-openai:
        condition: service_healthy
      mock-provider-anthropic:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 5

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    ports:
      - "3000:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:1.59
    container_name: jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      COLLECTOR_OTLP_GRPC_HOST_PORT: 0.0.0.0:4317
      COLLECTOR_OTLP_HTTP_HOST_PORT: 0.0.0.0:4318
    ports:
      - "16686:16686"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:14269/"]
      interval: 10s
      timeout: 3s
      retries: 5

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.2
    container_name: mlflow
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
    ports:
      - "5001:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.107.0
    container_name: otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./infra/otel/otel-collector-config.yml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
    depends_on:
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "--version"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  mlflow-data:
  prometheus-data:
  grafana-data:
  provider-registry-data:
  agent-registry-data:
