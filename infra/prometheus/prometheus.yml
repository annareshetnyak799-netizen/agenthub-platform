global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: api-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["api-gateway:8000"]

  - job_name: router-service
    metrics_path: /metrics
    static_configs:
      - targets: ["router-service:8001"]

  - job_name: provider-registry
    metrics_path: /metrics
    static_configs:
      - targets: ["provider-registry:8002"]

  - job_name: mock-provider-openai
    metrics_path: /metrics
    static_configs:
      - targets: ["mock-provider-openai:8101"]

  - job_name: mock-provider-anthropic
    metrics_path: /metrics
    static_configs:
      - targets: ["mock-provider-anthropic:8102"]
